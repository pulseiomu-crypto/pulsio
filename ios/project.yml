# PulsIO iOS — XcodeGen project spec (source of truth; the .xcodeproj is generated and git-ignored).
# Regenerate after adding files/targets:  cd ios && xcodegen
# Structure follows ARCHITECTURE.md §4: one folder per department, one folder per feature.
name: PulsIO

options:
  bundleIdPrefix: mu.pulsio
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad (SPEC §12)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  PulsIO:
    type: application
    platform: iOS
    sources:
      - path: PulsIO
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mu.pulsio.app
        PRODUCT_NAME: PulsIO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PulsIO/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: PulsIO/Resources/PulsIO.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO

  PulsIOTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PulsIOTests
    dependencies:
      - target: PulsIO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mu.pulsio.app.tests
        GENERATE_INFOPLIST_FILE: YES

  PulsIOUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PulsIOUITests
    dependencies:
      - target: PulsIO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mu.pulsio.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PulsIO

schemes:
  PulsIO:
    build:
      targets:
        PulsIO: all
        PulsIOTests: [test]
        PulsIOUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PulsIOTests
        - PulsIOUITests
    archive:
      config: Release
